name: Release

# Cuts a GitHub Release when a semver tag is pushed (e.g. v1.0.0). It rebuilds
# the frontend bundle and the contract wasm from the tagged commit and attaches
# them as release assets so every release is reproducible from source.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-frontend:
    name: Build frontend bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package dist
        run: |
          tar -czf vault-frontend-${{ github.ref_name }}.tar.gz -C dist .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-frontend
          path: vault-frontend-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  build-contract:
    name: Build contract wasm
    runs-on: ubuntu-latest
    env:
      RUST_MIN_STACK: "536870912"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.93.0
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          workspaces: contracts/vault_market
      - name: Build wasm
        working-directory: contracts/vault_market
        run: cargo build --target wasm32v1-none --release --locked
      - name: Stage wasm asset
        run: cp contracts/vault_market/target/wasm32v1-none/release/vault_market.wasm vault_market-${{ github.ref_name }}.wasm
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-contract
          path: vault_market-${{ github.ref_name }}.wasm
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-frontend, build-contract]
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Vault ${{ github.ref_name }}" \
            --generate-notes \
            artifacts/vault-frontend-${{ github.ref_name }}.tar.gz \
            artifacts/vault_market-${{ github.ref_name }}.wasm
