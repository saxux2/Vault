version: 2
updates:
  # Frontend / backend JS dependencies.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Batch low-risk updates to reduce PR noise.
      dev-dependencies:
        dependency-type: development
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]

  # Soroban smart contract crates.
  - package-ecosystem: cargo
    directory: "/contracts/vault_market"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Keep the pinned GitHub Actions SHAs current (security patches).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
